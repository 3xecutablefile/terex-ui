<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/terex-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terex UI / Settings</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("terax-ui-theme-shadow");
          var resolved =
            t === "light" || t === "dark"
              ? t
              : "dark";
          document.documentElement.classList.add(resolved);
          document.documentElement.style.backgroundColor =
            resolved === "dark" ? "#24212c" : "#24212c";
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="settings-root"></div>
    <script type="module" src="/src/settings/main.tsx"></script>
  </body>
</html>
