name: Release Terex UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      - run: pnpm exec vitest run --maxWorkers=4
      - run: node --test scripts/release.check.mjs

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TERAX_CLI_TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev patchelf rpm
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: release-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Set monotonic release version
        run: node scripts/release.mjs stamp
      - name: Build native installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build --ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Keep AppImage compatible with newer Wayland hosts
        if: runner.os == 'Linux'
        run: bash scripts/fix-appimage.sh 'src-tauri/target/${{ matrix.target }}/release/bundle/appimage'
      - name: Collect installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: node scripts/release.mjs collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish all platforms
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Assemble and validate signed update manifest
        run: node scripts/release.mjs manifest
      - name: Create release from this push
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BUILD: ${{ github.run_number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for ext in dmg app.tar.gz AppImage deb rpm exe msi; do
            compgen -G "*.$ext" >/dev/null
          done
          test -s latest.json
          test -s SHA256SUMS
          tag="build-$BUILD-$ATTEMPT"
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Automatic Terex UI build from commit $COMMIT.

          - macOS: Apple Silicon and Intel DMG installers and app archives.
          - Linux x64: AppImage, DEB, and RPM.
          - Windows x64: EXE and MSI installers.
          - SHA256SUMS contains checksums for the downloads.

          Automatic updates are available for macOS, Windows, and the Linux AppImage. Update packages are signed and bound to their release version. Save work and finish terminal commands before installing from the app.

          macOS app bundles use ad-hoc signing and are not notarized; Windows installers do not have Authenticode signing. DEB/RPM users should install the matching package manually.
          EOF
          mapfile -d '' assets < <(find . -maxdepth 1 -type f -print0)
          head="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          latest=false
          if [[ "$COMMIT" == "$head" ]]; then latest=true; fi
          gh release create "$tag" "${assets[@]}" --target "$COMMIT" --title "Terex UI build $BUILD.$ATTEMPT" --notes-file "$notes" --latest="$latest"
